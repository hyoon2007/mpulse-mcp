[project]
name = "mpulse-mcp"
version = "0.3.0"
description = "MCP server wrapping the Akamai mPulse Query API (RUM aggregate data) for Claude Desktop."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "hyoon" }]
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
mpulse-mcp = "mpulse_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpulse_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
